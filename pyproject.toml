[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "viaduck/_version.py"

[project]
name = "viaduck"
dynamic = ["version"]
description = "DuckLake to DuckLake CDC replication"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "pyducklake>=1.0.14",
    # 1.5.2 -> 1.5.5 (2026-07-31): the duckdb-1.5.2 extension channel is
    # frozen at ducklake build 415a9ebd (2026-04-09), whose per-connection
    # stats/schemas caches grow unbounded whenever catalog snapshots
    # advance between binds -- the OOM leak that killed the pod every
    # 4-6h (see hypothesis-1.md; A/B-verified: 415a9ebd leaks 1.07 MiB
    # per snapshot-advancing bind, the 1.5.5-channel build d8a1881e is
    # flat). The Dockerfile asserts the extension build at image build
    # time so channel drift can never be silent again.
    "duckdb==1.5.5",
    "pyarrow>=18.0",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    # pyducklake / duckdb invoke pytz at runtime when parsing timestamp
    # columns (e.g. Table.snapshots). Was previously in dev deps only,
    # which masked the issue under tests but broke prod with
    # `ModuleNotFoundError: No module named 'pytz'` on first snapshot call.
    "pytz>=2026.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
viaduck = "viaduck.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "testcontainers>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as E2E tests requiring docker-compose stack",
    "perf: marks tests as performance benchmarks",
]

[tool.uv]
# Supply-chain cooldown (org semgrep rule): resolve nothing published in
# the last 7 days. duckdb 1.5.5 is 2026-07-22 — outside the window.
exclude-newer = "7 days"
# pyducklake 1.0.16 hard-pins duckdb==1.5.2; override until pyducklake
# 1.0.17 relaxes the pin (tracked follow-up -- our package). Safe:
# 1.5.2 -> 1.5.5 is a patch-line bump, full unit+integration suite runs
# against 1.5.5 in CI/local.
override-dependencies = ["duckdb==1.5.5"]
