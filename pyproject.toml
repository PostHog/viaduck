[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "viaduck/_version.py"

[project]
name = "viaduck"
dynamic = ["version"]
description = "DuckLake to DuckLake CDC replication"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    # 1.0.17 moved the duckdb pin to ==1.5.5 (matching ours — the override
    # that worked around 1.0.16's ==1.5.2 pin is gone). 1.0.18 adds the
    # DETACH-before-close fix for hypothesis-2's Leak A (~5.5MB orphaned
    # per conflicted close) — wheel-verified 2026-08-14: Catalog.close()
    # now DETACHes best-effort before conn.close().
    "pyducklake>=1.0.18",
    # 1.5.2 -> 1.5.5 (2026-07-31): the duckdb-1.5.2 extension channel is
    # frozen at ducklake build 415a9ebd (2026-04-09), whose per-connection
    # stats/schemas caches grow unbounded whenever catalog snapshots
    # advance between binds -- the OOM leak that killed the pod every
    # 4-6h (see hypothesis-1.md; A/B-verified: 415a9ebd leaks 1.07 MiB
    # per snapshot-advancing bind, the 1.5.5-channel build d8a1881e is
    # flat). The Dockerfile asserts the extension build at image build
    # time so channel drift can never be silent again.
    "duckdb==1.5.5",
    "pyarrow>=18.0",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    # pyducklake / duckdb invoke pytz at runtime when parsing timestamp
    # columns (e.g. Table.snapshots). Was previously in dev deps only,
    # which masked the issue under tests but broke prod with
    # `ModuleNotFoundError: No module named 'pytz'` on first snapshot call.
    "pytz>=2026.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
viaduck = "viaduck.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "testcontainers>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as E2E tests requiring docker-compose stack",
    "perf: marks tests as performance benchmarks",
]

[tool.uv]
# Supply-chain cooldown (org semgrep rule): resolve nothing published in
# the last 7 days. duckdb 1.5.5 is 2026-07-22 — outside the window.
exclude-newer = "7 days"
# Cooldown carve-out for our own package (jghoman/pyducklake): 1.0.18 was
# published 2026-08-14T22:50Z and carries the DETACH-before-close Leak A
# fix (1.0.17 brought the duckdb==1.5.5 pin alignment). Fixed date, not a
# rolling window — future pyducklake releases re-enter the cooldown until
# this date is bumped alongside an intentional version bump. (Same
# carve-out pattern as millpond#119.)
exclude-newer-package = { pyducklake = "2026-08-15T00:00:00Z" }
