\* ViaduckJoin: C3 membership-epoch extension (DestStart cursor jumps).
\* Deliberately SMALLER than the main Viaduck.cfg run (MaxOps 3 / cap 2
\* vs 4 / 3): DestStart multiplies the state space by epoch/ghost-set
\* combinations, and this cfg is sized to finish in minutes, not the main
\* run's ~18. MaxOps = 3 is the minimum that exercises jump-over-delete
\* (insert, delete, +1 spare for update/reinsert interleavings).
SPECIFICATION JSpec

CONSTANTS
    Keys = {1, 2}
    Dests = {"d1", "d2"}
    Instances = {"i1"}
    MaxOps = 3
    BufferCap = 2
    RoutingMap <- RoutingMapDef
    DestOwner <- DestOwnerDef
    ValProj <- ValProjDef

CHECK_DEADLOCK FALSE

\* Base EventualConsistency / NoDataLossWhenCurrent / NoPhantomWhenCurrent
\* are intentionally ABSENT: they are false by construction once DestStart
\* can fire (a destination joining at head is never sent the pre-join
\* range). Their re-scoped replacements are below; the remaining base
\* invariants stay global and stay checked.
INVARIANT JoinScopedEventualConsistency
INVARIANT JoinScopedNoDataLoss
INVARIANT NoPhantomBeyondMissedDeletes
INVARIANT JoinSnapBound
INVARIANT DstKeyUniqueness
INVARIANT CursorMonotonicity
INVARIANT PartitionCorrectness
INVARIANT BufferPositionBound
INVARIANT FlushStateConsistency

PROPERTY CursorNeverRewinds
