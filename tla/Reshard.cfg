\* Reshard config-swap model, GUARDED variant (the C3 design): ConfigSwap
\* requires is_clean. Expected result: all invariants HOLD.
\* The negative test lives in ReshardUnguarded.cfg — same model,
\* GuardedSwap FALSE, where TLC finds the NoStaleEndpointWrite violation
\* proving the gate is load-bearing.
SPECIFICATION Spec

CONSTANTS
    MaxSnaps = 4
    GuardedSwap = TRUE

CHECK_DEADLOCK FALSE

INVARIANT NoStaleEndpointWrite
INVARIANT PositionBound
INVARIANT FlushStateOK
